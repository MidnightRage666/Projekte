<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        
        <div class="container">
            <h3>Shopping List</h3>

            <form>
                <p class="err">Please enter something to buy</p>
                <input type="text" id="input-buy" placeholder="Enter something to buy">
                <button id="add-buy">Add to shopping cart</button>
                <input id="search-input" type="text" placeholder="Search">

                <ul class="shopping-list">

                </ul>

                <button class="clear-all">Clear Shopping List</button>
            </form>
        </div>

    </main>
</body>
</html>
